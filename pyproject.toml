[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.5,<0.13" ]

[project]
name = "pyfaradaycup"
version = "0.1.0"
description = "Tools for data pipelines and data analysis for Faraday cups"
readme = "README.md"
authors = [
  { name = "Kristoff Paulson" },
  { name = "Mike Stevens" },
  { name = "Joy Velasquez" },
  { name = "Nick Murphy", email = "namurphy@cfa.harvard.edu" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "astropy>=3",
  "plasmapy>=0.3.1",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "nox" },
  { include-group = "test" },
  { include-group = "typecheck" },
  { include-group = "zizmor" },
]
test = [
  "pytest>=9.1",
  "pytest-filter-subpackage>=0.2",
  "pytest-xdist>=3.8",
]
lint = [
  "pre-commit>=4.6.2",
]
nox = [
  "nox>=2026.8.10",
  "nox-uv>=0.8",
]
typecheck = [
  "ty>=0.0.74",
]
zizmor = [
  "zizmor>=1.29",
]

[tool.ruff]
target-version = "py312"
namespace-packages = [ ".github/workflows", "docs" ]
extend-exclude = [
  ".hypothesis",
  ".idea",
  ".jupyter",
  "__pycache__",
  "_dev",
]
show-fixes = true
output-format = "grouped"
format.line-ending = "lf"
format.docstring-code-format = true
# Using an IDE like PyCharm with a ruff plugin will make rule names appear as inlay hints
lint.extend-select = [
