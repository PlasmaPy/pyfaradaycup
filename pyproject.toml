lint.ignore = [
  "ANN001",  # add file-wide ignore comments?
  "COM812",  # handled by ruff format
  "COM819",  # adding trailing commas leads to simpler diffs
  "D200",    # incompatible with multiline short summaries
  "D203",    # handled by ruff format
  "D205",    # incompatible with multiline short summaries
  "D206",    # handled by ruff format
  "D300",    # handled by ruff format
  "D401",    # enable later?
  "E111",    # handled by ruff format
  "E114",    # handled by ruff format
  "E117",    # handled by ruff format
  "E501",    # handled by ruff format
  "EM101",   # enable later in focused PR
  "EM102",   # enable later in focused PR
  "N802",    # inconsistent with capitalization from physics notation
  "N803",    # inconsistent with capitalization from physics notation
  "N806",    # inconsistent with capitalization from physics notation
  "N816",    # inconsistent with capitalization from physics notation
  "PLC2401", # flags variables used as mathematical symbols
  "PLC2403", # flags variables used as mathematical symbols
  "PLE0605", # flags `__all__ += __lite_funcs`
  "PLR0913", # too many situations where lots of arguments are justified
  "PLR2004", # would need case-by-case evaluations
  "PT011",   # would require using match keyword argument
  "PT012",   # enable later?
  "PT019",   # enable later?
  "PYI024",  # enable later?
  "Q001",    # handled by ruff format
  "Q002",    # handled by ruff format
  "Q003",    # handled by ruff format
  "Q004",    # handled by ruff format
  "RET505",  # enable later?
  "RET506",  # enable later?
  "TD002",   # enable later?
  "TD003",   # enable later?
  "TRY003",  # enable later?
  "W191",    # handled by ruff format
]
lint.extend-per-file-ignores."**/*.ipynb" = [ "T201", "T203" ]
lint.extend-per-file-ignores.".github/scripts/*.py" = [ "D103", "INP001" ]
lint.extend-per-file-ignores."__init__.py" = [ "D104", "E402", "F401", "F402", "F403" ]  # ignore import errors
lint.extend-per-file-ignores."docs/conf.py" = [ "D100", "D103", "E402", "EXE001", "EXE005", "F401" ]
# Most ruff rule violations in the following files should eventually be fixed
lint.extend-per-file-ignores."docs/notebooks/analysis/fit_functions.ipynb" = [ "NPY002" ]
lint.extend-per-file-ignores."docs/notebooks/analysis/nullpoint.ipynb" = [ "D103" ]
lint.extend-per-file-ignores."docs/notebooks/analysis/swept_langmuir/find_floating_potential.ipynb" = [ "FBT003" ]
lint.extend-per-file-ignores."docs/notebooks/diagnostics/charged_particle_radiography_film_stacks.ipynb" = [
  "B007",
  "PTH123"
]
lint.extend-per-file-ignores."docs/notebooks/diagnostics/charged_particle_radiography_particle_tracing.ipynb" = [
  "D103",
  "E741",
]
lint.extend-per-file-ignores."docs/notebooks/diagnostics/charged_particle_radiography_particle_tracing_custom_source.ipynb" = [
  "NPY002",
]
lint.extend-per-file-ignores."docs/notebooks/diagnostics/charged_particle_radiography_particle_tracing_wire_mesh.ipynb" = [
  "D103",
]
lint.extend-per-file-ignores."docs/notebooks/diagnostics/thomson_fitting.ipynb" = [ "NPY002", "PD011" ]
lint.extend-per-file-ignores."docs/notebooks/dispersion/dispersion_function.ipynb" = [ "D103" ]
lint.extend-per-file-ignores."docs/notebooks/dispersion/stix_dispersion.ipynb" = [ "FBT003" ]
lint.extend-per-file-ignores."docs/notebooks/formulary/cold_plasma_tensor_elements.ipynb" = [ "FBT003" ]
lint.extend-per-file-ignores."docs/notebooks/formulary/ExB_drift.ipynb" = [ "B008", "D103" ]
lint.extend-per-file-ignores."docs/notebooks/langmuir_samples/_generate_noisy.ipynb" = [ "ANN202", "NPY002", "PTH123" ]
lint.extend-per-file-ignores."docs/notebooks/plasma/grids_cartesian.ipynb" = [ "NPY002", "PLW2901" ]
lint.extend-per-file-ignores."docs/notebooks/plasma/grids_nonuniform.ipynb" = [ "NPY002" ]
lint.extend-per-file-ignores."setup.py" = [ "D100" ]
lint.extend-per-file-ignores."src/plasmapy/analysis/fit_functions.py" = [ "D301" ]
lint.extend-per-file-ignores."src/plasmapy/analysis/swept_langmuir/__init__.py" = [ "E402" ]
lint.extend-per-file-ignores."src/plasmapy/formulary/braginskii.py" = [ "C901", "RET503", "RET504" ]
lint.extend-per-file-ignores."src/plasmapy/plasma/sources/*.py" = [ "D102" ]
lint.extend-per-file-ignores."src/plasmapy/utils/_pytest_helpers/pytest_helpers.py" = [ "BLE001", "PLR", "SLF001" ]
lint.extend-per-file-ignores."tests/**/__init__.py" = [ "D104" ]
lint.extend-per-file-ignores."tests/**/test_*.py" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D209",
  "D400",
  "D401",
  "DOC201",
  "DOC501",
  "INP001",
  "N801",
  "N802",
  "PLC2701",
  "PLR6301",
  "RUF012",
  "S101",
  "SLF001",
]
lint.extend-per-file-ignores."tests/formulary/collisions/test_coulomb.py" = [ "PT031" ]
lint.extend-per-file-ignores."tests/formulary/test_distribution.py" = [ "ARG005" ]
lint.extend-per-file-ignores."tests/formulary/test_transport.py" = [ "PT031" ]
lint.extend-per-file-ignores."tests/particles/test_decorators.py" = [ "ARG001", "ARG002" ]
lint.extend-per-file-ignores."tests/utils/_pytest_helpers/test_pytest_helpers.py" = [ "BLE001", "TRY002" ]
lint.extend-per-file-ignores."tests/utils/decorators/test_converters.py" = [ "ARG001", "ARG005" ]
# Allow potentially ambiguous Unicode characters with valid uses in plasma science
lint.allowed-confusables = [
  "×",
  "–",
  "′",
  "∨",
  "∪",
  "∼",
  "⊤",
  "α",
  "ℂ",
  "ℰ",
  "ℱ",
  "γ",
  "ℎ",
  "ι",
  "ℐ",
  "ℑ",
  "ℒ",
  "ℓ",
  "ℳ",
  "ν",
  "ℕ",
  "ο",
  "𝒪",
  "ℚ",
  "ρ",
  "ℜ",
  "ℝ",
  "σ",
  "τ",
  "β",
  "υ",
  "ℤ",
]
lint.dummy-variable-rgx = "^(Z|mass_numb|request|event|_.*)$"
lint.flake8-annotations.allow-star-arg-any = true
lint.flake8-annotations.ignore-fully-untyped = true
lint.flake8-annotations.suppress-dummy-args = true
lint.flake8-annotations.suppress-none-returning = true
lint.flake8-import-conventions.aliases."astropy.constants" = "const"
lint.flake8-import-conventions.aliases."astropy.units" = "u"
lint.flake8-import-conventions.aliases."matplotlib.pyplot" = "plt"
lint.flake8-import-conventions.aliases.matplotlib = "mpl"
lint.flake8-import-conventions.aliases.numpy = "np"
lint.flake8-import-conventions.aliases.pandas = "pd"
lint.flake8-import-conventions.banned-from = [
  "astropy.units",
  "matplotlib.pyplot",
  "numpy",
  "pytest",
  "warnings",
]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.flake8-tidy-imports.banned-api."typing.Callable".msg = "Deprecated alias. Change to collections.abc.Callable"
lint.flake8-tidy-imports.banned-api."typing.Collection".msg = "Deprecated alias. Change to collections.abc.Collection"
lint.flake8-tidy-imports.banned-api."typing.DefaultDict".msg = "Deprecated alias. Change to collections.defaultdict"
lint.flake8-tidy-imports.banned-api."typing.Dict".msg = "Deprecated alias. Change to dict"
lint.flake8-tidy-imports.banned-api."typing.Generator".msg = "Deprecated alias. Change to collections.abc.Generator"
lint.flake8-tidy-imports.banned-api."typing.Iterable".msg = "Deprecated alias. Change to collections.abc.Iterable"
lint.flake8-tidy-imports.banned-api."typing.Iterator".msg = "Deprecated alias. Change to collections.abc.Iterator"
lint.flake8-tidy-imports.banned-api."typing.List".msg = "Deprecated alias. Change to list"
lint.flake8-tidy-imports.banned-api."typing.Mapping".msg = "Deprecated alias. Change to collections.abc.mapping"
lint.flake8-tidy-imports.banned-api."typing.MutableMapping".msg = "Deprecated alias. Change to collections.abc.MutableMapping"
lint.flake8-tidy-imports.banned-api."typing.Sequence".msg = "Deprecated alias. Change to collections.abc.Sequence"
lint.flake8-tidy-imports.banned-api."typing.Set".msg = "Deprecated alias. Change to set"
lint.flake8-tidy-imports.banned-api."typing.Tuple".msg = "Deprecated alias. Change to tuple"
lint.flake8-tidy-imports.banned-api."typing.Type".msg = "Deprecated alias. Change to type"
lint.flake8-unused-arguments.ignore-variadic-names = true
lint.isort.known-first-party = [ "plasmapy" ]
lint.mccabe.max-complexity = 10
lint.pydocstyle.convention = "numpy"

[tool.pytest]  # https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
addopts = [
  "--dist=loadfile",
  "--durations=5",
  "--durations-min=0.4",
  "--numprocesses=auto",
  "--tb=short",
]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
  # To prevent the number of warnings issue during tests from ballooning,
  # treat warnings as errors unless otherwise specified. Please raise a
  # GitHub issue when ignoring a FutureWarning or DeprecationWarning,
  # and label it with "needed for release".
  "error",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
strict = true
testpaths = [ "tests", "src/pyfaradaycup" ]
