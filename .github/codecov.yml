# Configuration for Codecov: https://docs.codecov.com/docs/codecov-yaml
#
# Coverage reports are generated by `nox -s coverage-<python>` and
# uploaded in .github/workflows/ci.yml.

coverage:
  status:
    project:
      default:
        target: auto  # compare against the coverage of the base commit
        threshold: 0.1%  # allowed decrease before the check fails
    patch:
      default:
        target: 95%  # minimum coverage of lines changed in a PR

comment:
  layout: diff, flags, files
  behavior: default
  require_changes: true
